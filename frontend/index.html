<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Harness</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; max-width: 760px; margin: 0 auto; padding: 20px; }
  h2 { margin: 0 0 12px; }
  #chat { height: 68vh; overflow-y: auto; border: 1px solid #8884; border-radius: 10px; padding: 14px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 10px; }
  .row { max-width: 88%; padding: 8px 12px; border-radius: 12px; white-space: pre-wrap; word-break: break-word; }
  .user { align-self: flex-end; background: #2563eb; color: #fff; }
  .proc { align-self: flex-start; color: #888; font-size: 0.82em; padding: 3px 8px; border-left: 2px solid #8885; border-radius: 0; max-width: 94%; }
  .result { align-self: flex-start; background: #f3f4f6; color: #111; }
  .error { align-self: flex-start; color: #dc2626; }
  form { display: flex; gap: 8px; }
  input { flex: 1; padding: 11px; border: 1px solid #8884; border-radius: 10px; font-size: 1em; }
  button { padding: 11px 18px; border: 0; border-radius: 10px; background: #2563eb; color: #fff; font-size: 1em; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  #stop { background: #dc2626; }
  #stop:disabled { background: #888; opacity: 0.4; }
</style>
</head>
<body>
  <h2>Agent Harness</h2>
  <div id="chat"></div>
  <form id="form">
    <input id="input" placeholder="输入消息，回车发送…" autocomplete="off">
    <button id="send" type="submit">发送</button>
    <button id="stop" type="button" disabled>停止</button>
  </form>

  <script>
    // 后端地址：改成你的 agent-harness 部署域名
    const API_BASE = "https://agent-harness-app.vercel.app";

    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const stopBtn = document.getElementById("stop");

    let sessionId = null;   // 复用同一会话，保持上下文
    let thinkEl = null;     // 当前累积的思考块
    let pollTimer = null;   // 当前轮询事件流的定时器
    let running = false;    // 是否正在执行一个 turn

    const esc = (s) => String(s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

    function add(cls, html) {
      const d = document.createElement("div");
      d.className = "row " + cls;
      d.innerHTML = html;
      chat.appendChild(d);
      chat.scrollTop = chat.scrollHeight;
      return d;
    }

    function appendThinking(text) {
      if (!thinkEl) thinkEl = add("proc", "💭 ");
      thinkEl.appendChild(document.createTextNode(text));
      chat.scrollTop = chat.scrollHeight;
    }

    function renderEvent(ev) {
      const p = ev.payload || {};
      switch (ev.type) {
        case "turn.started": return add("proc", "▶ 开始执行");
        case "tool.started": return add("proc", "🔧 调用 <b>" + esc(p.name || "tool") + "</b>…");
        case "tool.completed": {
          const name = p.tool_name || "tool";
          const summary = p.summary || "";
          const mark = p.outcome === "fail" ? "❌" : "✅";
          return add("proc", mark + " <b>" + esc(name) + "</b><br>" + esc(summary));
        }
        case "ask_user": return add("proc", "❓ 等待回答：" + esc(p.question || ""));
        case "permission.pending": return add("proc", "🔐 等待审批：" + esc(p.question || p.tool_name || "tool"));
        case "turn.completed": return add("proc", "🏁 完成");
        case "turn.failed": return add("proc", "❌ 失败" + (p.error ? "：" + esc(p.error) : ""));
        case "turn.cancelled": return add("proc", "⛔ 已取消");
        default: return; // 忽略 assistant.delta 等
      }
    }

    async function pollEvents(seen) {
      if (!sessionId) return;
      try {
        const r = await fetch(API_BASE + "/api/events?session_id=" + encodeURIComponent(sessionId));
        const d = await r.json();
        for (const ev of d.events || []) {
          if (seen.has(ev.id)) continue;
          seen.add(ev.id);
          if (ev.type === "thinking.delta") {
            appendThinking(ev.payload?.text || "");
          } else {
            thinkEl = null;   // 结束当前思考块
            renderEvent(ev);
          }
        }
      } catch (_) { /* ignore transient poll errors */ }
    }

    stopBtn.addEventListener("click", async () => {
      if (!running || !sessionId) return;
      stopBtn.disabled = true;
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      try {
        await fetch(API_BASE + "/api/cancel", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId }),
        });
      } catch (_) { /* 忽略取消请求本身的瞬时错误 */ }
      thinkEl = null;
      add("proc", "⛔ 已请求取消");
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text || running) return;
      input.value = "";
      add("user", esc(text));
      running = true;
      sendBtn.disabled = true;
      stopBtn.disabled = false;

      if (!sessionId) sessionId = "ses_" + Math.random().toString(36).slice(2, 10);
      const seen = new Set();
      pollTimer = setInterval(() => pollEvents(seen), 700);

      try {
        const r = await fetch(API_BASE + "/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text, session_id: sessionId }),
        });
        const data = await r.json();
        if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
        await pollEvents(seen);                 // 拉齐最后一批事件
        thinkEl = null;
        if (data.final_text) {
          add("result", esc(data.final_text));
        } else if (data.status !== "completed" && data.status !== "cancelled") {
          add("error", "状态：" + esc(data.status));
        }
      } catch (err) {
        if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
        thinkEl = null;
        add("error", "错误：" + esc(err.message));
      } finally {
        running = false;
        sendBtn.disabled = false;
        stopBtn.disabled = true;
        input.focus();
      }
    });
  </script>
</body>
</html>
