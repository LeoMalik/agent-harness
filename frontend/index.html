<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Harness</title>
<style>
:root{--bg:#fff;--side:#f7f7f8;--line:#e6e6e8;--text:#242426;--muted:#77777d;--hover:#ececee;--active:#e4e4e7;--blue:#2563eb;--red:#b42318}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:var(--bg);letter-spacing:0;overflow:hidden}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}.app{height:100vh;height:100dvh;display:grid;grid-template-columns:270px minmax(0,1fr);grid-template-rows:minmax(0,1fr)}.sidebar{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}.brand{height:54px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line);font-weight:700}.logo{width:27px;height:27px;border-radius:7px;background:#242426;color:#fff;display:grid;place-items:center}.side-scroll{padding:11px;overflow:auto;flex:1}.workspace-row{display:flex;align-items:center;gap:8px;margin-bottom:12px}.workspace-row select{flex:1;min-width:0;border:1px solid var(--line);background:#fff;padding:8px;border-radius:7px;font-weight:600}.icon-btn{width:32px;height:32px;border:0;background:transparent;border-radius:6px;font-size:18px}.icon-btn:hover,.nav-btn:hover,.session:hover{background:var(--hover)}.new-btn{width:100%;border:1px solid var(--line);background:#fff;border-radius:7px;padding:9px 10px;text-align:left;font-weight:600;margin-bottom:12px}.nav{display:grid;gap:2px;margin-bottom:14px}.nav-btn{border:0;background:transparent;border-radius:6px;padding:7px 9px;display:flex;align-items:center;gap:9px;text-align:left}.nav-btn.active{background:var(--active);font-weight:600}.count{margin-left:auto;color:var(--muted);font-size:12px}.section-title{font-size:11px;color:var(--muted);text-transform:uppercase;margin:14px 8px 7px}.sessions{display:grid;gap:2px}.session{border:0;background:transparent;border-radius:6px;padding:8px 9px;text-align:left;min-width:0}.session.active{background:#dddde1}.session-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.session-meta{display:flex;gap:6px;color:var(--muted);font-size:11px;margin-top:2px}.sidebar-bottom{border-top:1px solid var(--line);padding:10px 12px;color:var(--muted);font-size:12px}.main{min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column}.topbar{height:54px;flex:0 0 54px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px;gap:10px}.top-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top-actions{margin-left:auto;display:flex;gap:5px}.text-btn{border:0;background:transparent;border-radius:6px;padding:7px 9px}.text-btn:hover{background:var(--hover)}.chat{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;padding:30px max(20px,calc((100% - 800px)/2)) 16px;display:flex;flex-direction:column;gap:18px}.empty{margin:auto;text-align:center;color:var(--muted)}.empty h1{font-size:25px;color:var(--text);margin:0 0 8px}.msg{max-width:82%;white-space:pre-wrap;word-break:break-word}.user{align-self:flex-end;background:#f0f0f2;border-radius:16px 16px 4px 16px;padding:10px 14px}.assistant{align-self:flex-start;padding:2px 0}.event{align-self:flex-start;border-left:2px solid #c7c7cc;padding:3px 10px;color:var(--muted);font-size:12px;max-width:88%;white-space:pre-wrap}.event.fail{border-color:#dc2626;color:var(--red)}.event.live{border-color:#73737a;color:#555}.event.live::after{content:'';display:inline-block;width:6px;height:6px;margin-left:7px;border-radius:50%;background:#777;animation:pulse 1.1s ease-in-out infinite}@keyframes pulse{50%{opacity:.25}}.composer-wrap{flex:0 0 auto;min-width:0;padding:0 max(18px,calc((100% - 860px)/2)) 14px}.composer{border:1px solid #cfcfd4;border-radius:12px;background:#fff;box-shadow:0 4px 18px #0000000d;overflow:hidden;transition:border-color .15s,box-shadow .15s}.composer:focus-within,.composer.new-chat-ready{border-color:#74747b;box-shadow:0 0 0 3px #24242618,0 4px 18px #0000000d}.composer textarea{width:100%;min-height:62px;max-height:160px;resize:none;border:0;outline:0;padding:13px 14px 6px}.composer-actions{display:flex;align-items:center;padding:5px 8px 8px;gap:6px}.pill{border:0;background:transparent;border-radius:6px;padding:6px 8px;color:#555}.pill:hover{background:var(--hover)}.send{margin-left:auto;width:32px;height:32px;border:0;border-radius:50%;background:#202124;color:#fff;font-size:17px}.send:disabled{opacity:.35}.stop{border:0;background:#fee2e2;color:#991b1b;border-radius:6px;padding:6px 9px}.stats{display:flex;align-items:center;gap:13px;min-height:28px;padding:5px 4px 0;color:var(--muted);font-size:11px;white-space:nowrap;overflow:auto}.stat b{color:#4b4b50;font-weight:600}.modal{position:fixed;inset:0;background:#0005;display:none;place-items:center;padding:20px}.modal.open{display:grid}.dialog{width:min(680px,100%);background:#fff;border-radius:10px;box-shadow:0 18px 60px #0003;overflow:hidden}.dialog-head{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:700}.dialog-body{padding:16px;display:grid;gap:13px}.field{display:grid;gap:6px}.field label{font-size:12px;color:var(--muted)}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:7px;padding:9px;background:#fff}.field textarea{min-height:230px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}.dialog-foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:8px 13px}.btn.primary{background:#202124;color:#fff;border-color:#202124}.mobile-toggle{display:none}@media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{position:fixed;z-index:5;inset:0 auto 0 0;width:270px;transform:translateX(-100%);transition:.2s}.sidebar.open{transform:none}.mobile-toggle{display:block}.topbar{padding:0 10px;gap:6px}.top-title{flex:1}.top-actions{gap:2px}.top-actions .text-btn{width:32px;height:32px;padding:0;font-size:0;overflow:hidden}.top-actions #starBtn{font-size:16px}.top-actions #archiveBtn::before{content:'▤';font-size:16px}.top-actions #personaBtn::before{content:'⚙';font-size:16px}.chat{padding-left:18px;padding-right:18px}.composer-wrap{padding-left:10px;padding-right:10px}}@media(prefers-reduced-motion:reduce){.sidebar{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="logo">A</div><span>Agent Harness</span></div>
  <div class="side-scroll">
    <div class="workspace-row"><select id="workspace"></select><button class="icon-btn" id="addWorkspace" title="新建 Workspace">＋</button></div>
    <button class="new-btn" id="newChat">＋ 新建聊天</button>
    <nav class="nav" id="filters">
      <button class="nav-btn active" data-filter="all">▣ 全部<span class="count" id="count-all">0</span></button>
      <button class="nav-btn" data-filter="unread">● 未读<span class="count" id="count-unread">0</span></button>
      <button class="nav-btn" data-filter="starred">★ 星标<span class="count" id="count-starred">0</span></button>
      <button class="nav-btn" data-filter="archived">▤ 已归档<span class="count" id="count-archived">0</span></button>
      <button class="nav-btn" data-filter="trashed">⌫ 回收站<span class="count" id="count-trashed">0</span></button>
    </nav>
    <div class="section-title">对话</div><div class="sessions" id="sessions"></div>
  </div>
  <div class="sidebar-bottom">用户 <b id="userLabel">local</b> · 余额 <b id="sideCredits">—</b></div>
</aside>
<main class="main">
  <header class="topbar"><button class="icon-btn mobile-toggle" id="menuBtn">☰</button><div class="top-title" id="chatTitle">新聊天</div><div class="top-actions"><button class="text-btn" id="starBtn" title="星标">☆</button><button class="text-btn" id="archiveBtn">归档</button><button class="text-btn" id="personaBtn">人设与模型</button></div></header>
  <section class="chat" id="chat"><div class="empty" id="empty"><h1>我能帮你做什么？</h1><div>选择一个 Workspace，或开始一段新对话。</div></div></section>
  <div class="composer-wrap">
    <form class="composer" id="form"><textarea id="input" placeholder="给 Agent Harness 发消息" autocomplete="off"></textarea><div class="composer-actions"><button type="button" class="pill" id="attachBtn" title="附件">＋</button><button type="button" class="pill" id="modelPill">模型</button><button type="button" class="pill" id="effortPill">思考：中</button><button type="button" class="stop" id="stop" hidden>停止</button><button class="send" id="send" type="submit" title="发送">↑</button></div></form>
    <div class="stats"><span class="stat">模型 <b id="statModel">—</b></span><span class="stat">思考 <b id="statEffort">—</b></span><span class="stat">输入 <b id="statIn">0</b></span><span class="stat">输出 <b id="statOut">0</b></span><span class="stat">工具 <b id="statTools">0</b></span><span class="stat">余额 <b id="statCredits">—</b></span><span class="stat">状态 <b id="statStatus">就绪</b></span></div>
  </div>
</main>
</div>
<div class="modal" id="settingsModal"><div class="dialog"><div class="dialog-head">人设与模型<button class="icon-btn" id="closeSettings" style="margin-left:auto">×</button></div><div class="dialog-body"><div class="field"><label>默认模型</label><select id="settingModel"></select></div><div class="field"><label>思考强度</label><select id="settingEffort"><option value="low">低</option><option value="medium">中</option><option value="high">高</option></select></div><div class="field"><label>SOUL.md · 用户默认人设</label><textarea id="settingSoul" spellcheck="false"></textarea></div></div><div class="dialog-foot"><button class="btn" id="cancelSettings">取消</button><button class="btn primary" id="saveSettings">保存</button></div></div></div>
<script>
const API='https://agent-harness-app.vercel.app', params=new URLSearchParams(location.search), userId=params.get('user_id')||localStorage.getItem('harness-user')||'local';
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let workspaceId=params.get('workspace_id')||localStorage.getItem('harness-workspace')||'default',sessionId=null,filter='all',sessions=[],settings=null,running=false,pending=false,pollTimer=null,thinkEl=null,assistantEl=null,statusEl=null,seen=new Set();
const labels={low:'低',medium:'中',high:'高'};
$('userLabel').textContent=userId;
async function api(path,opt={}){const r=await fetch(API+path,{headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});const d=await r.json();if(!r.ok)throw new Error(d.error||r.statusText);return d}
function message(cls,text){$('empty')?.remove();const d=document.createElement('div');d.className='msg '+cls;d.textContent=text;$('chat').appendChild(d);$('chat').scrollTop=$('chat').scrollHeight;return d}
function eventRow(text,fail=false){$('empty')?.remove();const d=document.createElement('div');d.className='event'+(fail?' fail':'');d.textContent=text;$('chat').appendChild(d);$('chat').scrollTop=$('chat').scrollHeight;return d}
function clearLiveStatus(){statusEl?.remove();statusEl=null}
function liveStatus(text){if(!statusEl){statusEl=eventRow(text);statusEl.classList.add('live')}else statusEl.firstChild.textContent=text;$('chat').scrollTop=$('chat').scrollHeight}
function renderEvent(ev){const p=ev.payload||{};if(ev.type==='turn.started'){liveStatus('模型正在处理');$('statStatus').textContent='running';return}if(ev.type==='thinking.delta'){clearLiveStatus();if(!thinkEl)thinkEl=eventRow('思考中\n');thinkEl.textContent+=p.text||'';return}if(ev.type==='assistant.delta'){clearLiveStatus();thinkEl=null;if(!assistantEl)assistantEl=message('assistant','');assistantEl.textContent+=p.text||'';$('chat').scrollTop=$('chat').scrollHeight;return}if(ev.type==='session.title_updated'){loadSessions().then(setHeader);return}if(ev.type==='tool.started'){clearLiveStatus();eventRow('调用 '+(p.name||'tool')+'…');liveStatus('工具执行中');return}if(ev.type==='tool.completed'){clearLiveStatus();eventRow((p.outcome==='fail'?'失败 ':'完成 ')+(p.tool_name||'tool')+(p.summary?' · '+p.summary:''),p.outcome==='fail');liveStatus('模型继续处理');return}if(ev.type==='permission.pending'){clearLiveStatus();eventRow('等待审批 · '+(p.question||p.tool_name||'tool'));return}if(ev.type==='ask_user'){clearLiveStatus();eventRow('等待回答 · '+(p.question||''));return}if(ev.type==='metrics.llm'){if(p.input_tokens!=null)$('statIn').textContent=p.input_tokens;if(p.output_tokens!=null)$('statOut').textContent=p.output_tokens;return}if(ev.type==='turn.completed'){clearLiveStatus();$('statStatus').textContent='completed';return}if(ev.type==='turn.cancelled'){clearLiveStatus();eventRow('已停止');$('statStatus').textContent='cancelled';return}if(ev.type==='turn.failed'){clearLiveStatus();eventRow('运行失败 · '+(p.error||'未知错误'),true);$('statStatus').textContent='failed'}}
async function poll(){if(!sessionId)return;try{const d=await api('/api/events?session_id='+encodeURIComponent(sessionId));for(const ev of d.events||[]){if(seen.has(ev.id))continue;seen.add(ev.id);renderEvent(ev)}}catch{}}
async function loadWorkspaces(){const d=await api('/api/workspaces?user_id='+encodeURIComponent(userId));const names=d.workspaces||['default'];if(!names.includes(workspaceId))names.push(workspaceId);$('workspace').innerHTML=names.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');$('workspace').value=workspaceId}
function passes(s){if(filter==='all')return !s.trashed&&!s.archived;if(filter==='unread')return s.unread&&!s.trashed;if(filter==='starred')return s.starred&&!s.trashed;if(filter==='archived')return s.archived&&!s.trashed;return s.trashed}
function renderSessions(){const counts={all:0,unread:0,starred:0,archived:0,trashed:0};for(const s of sessions){if(!s.trashed&&!s.archived)counts.all++;if(s.unread&&!s.trashed)counts.unread++;if(s.starred&&!s.trashed)counts.starred++;if(s.archived&&!s.trashed)counts.archived++;if(s.trashed)counts.trashed++}Object.keys(counts).forEach(k=>$('count-'+k).textContent=counts[k]);const rows=sessions.filter(passes);$('sessions').innerHTML=rows.length?rows.map(s=>`<button class="session ${s.session_id===sessionId?'active':''}" data-id="${s.session_id}"><div class="session-title">${s.starred?'★ ':''}${esc(s.title||'未命名聊天')}</div><div class="session-meta"><span>${esc((s.updated_at||'').slice(0,10))}</span>${s.unread?'<span>未读</span>':''}</div></button>`).join(''):'<div class="session-meta" style="padding:8px">没有会话</div>';document.querySelectorAll('.session').forEach(b=>b.onclick=()=>selectSession(b.dataset.id))}
async function loadSessions(){const d=await api('/api/sessions?user_id='+encodeURIComponent(userId)+'&workspace_id='+encodeURIComponent(workspaceId));sessions=d.sessions||[];renderSessions()}
function refreshTitleSoon(){let tries=0;const timer=setInterval(async()=>{tries++;await poll();await loadSessions();setHeader();const current=sessions.find(s=>s.session_id===sessionId);if(current?.title||tries>=5)clearInterval(timer)},800)}
function setHeader(){const s=sessions.find(x=>x.session_id===sessionId);$('chatTitle').textContent=s?.title||'新聊天';$('starBtn').textContent=s?.starred?'★':'☆'}
async function selectSession(id){sessionId=id;seen=new Set();thinkEl=assistantEl=statusEl=null;$('chat').innerHTML='';renderSessions();setHeader();$('sidebar').classList.remove('open');const d=await api('/api/history?session_id='+encodeURIComponent(id));for(const e of d.events||[]){const p=e.payload||{};if(e.type==='user_message')message('user',p.text||'');if(e.type==='assistant_message')message('assistant',p.text||'')}await refreshStats();pending=$('statStatus').textContent==='pending'}
function newChat(){sessionId=null;pending=false;seen=new Set();thinkEl=assistantEl=statusEl=null;$('chat').innerHTML='<div class="empty" id="empty"><h1>开始新聊天</h1><div>在下方输入框中描述你的任务，然后按 Enter 发送。</div></div>';$('input').value='';$('sidebar').classList.remove('open');setHeader();renderSessions();resetStats();const composer=$('form');composer.classList.add('new-chat-ready');requestAnimationFrame(()=>{composer.scrollIntoView({block:'end',behavior:'smooth'});$('input').focus({preventScroll:true})});setTimeout(()=>composer.classList.remove('new-chat-ready'),1400)}
function resetStats(){$('statIn').textContent='0';$('statOut').textContent='0';$('statTools').textContent='0';$('statStatus').textContent='就绪';if(settings){$('statModel').textContent=settings.default_model;$('statEffort').textContent=labels[settings.reasoning_effort]}}
async function refreshStats(){if(!sessionId){resetStats();return}const d=await api('/api/stats?session_id='+encodeURIComponent(sessionId));$('statModel').textContent=d.model||settings?.default_model||'—';$('statEffort').textContent=labels[d.reasoning_effort]||d.reasoning_effort||'—';$('statIn').textContent=d.input_tokens||0;$('statOut').textContent=d.output_tokens||0;$('statTools').textContent=d.tool_calls||0;$('statCredits').textContent=d.credits??'—';$('sideCredits').textContent=d.credits??'—';$('statStatus').textContent=d.status||'就绪'}
function updateSettingLabels(){$('statModel').textContent=settings.default_model;$('statEffort').textContent=labels[settings.reasoning_effort];$('modelPill').textContent=settings.default_model.split('/').pop();$('effortPill').textContent='思考：'+labels[settings.reasoning_effort]}
async function loadSettings(){const d=await api('/api/settings?user_id='+encodeURIComponent(userId));settings=d.settings;const models=d.available_models||[];$('settingModel').innerHTML=models.map(m=>`<option>${esc(m)}</option>`).join('');$('settingModel').value=settings.default_model;$('settingEffort').value=settings.reasoning_effort;$('settingSoul').value=settings.soul_md||'';updateSettingLabels()}
function openSettings(){$('settingModel').value=settings.default_model;$('settingEffort').value=settings.reasoning_effort;$('settingSoul').value=settings.soul_md||'';$('settingsModal').classList.add('open')}
async function saveSettings(){const d=await api('/api/settings',{method:'POST',body:JSON.stringify({user_id:userId,default_model:$('settingModel').value,reasoning_effort:$('settingEffort').value,soul_md:$('settingSoul').value})});settings=d.settings;updateSettingLabels();$('settingsModal').classList.remove('open')}
async function patchSession(patch){if(!sessionId)return;await api('/api/session',{method:'POST',body:JSON.stringify({session_id:sessionId,...patch})});await loadSessions();setHeader()}
$('filters').onclick=e=>{const b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;document.querySelectorAll('.nav-btn').forEach(x=>x.classList.toggle('active',x===b));renderSessions()};
$('workspace').onchange=async()=>{workspaceId=$('workspace').value;localStorage.setItem('harness-workspace',workspaceId);newChat();await loadSessions()};
$('addWorkspace').onclick=async()=>{const name=prompt('Workspace 名称');if(!name?.trim())return;workspaceId=name.trim();localStorage.setItem('harness-workspace',workspaceId);await loadWorkspaces();newChat();await loadSessions()};
$('newChat').onclick=newChat;$('personaBtn').onclick=openSettings;$('modelPill').onclick=openSettings;$('effortPill').onclick=openSettings;$('closeSettings').onclick=$('cancelSettings').onclick=()=> $('settingsModal').classList.remove('open');$('saveSettings').onclick=saveSettings;$('starBtn').onclick=()=>{const s=sessions.find(x=>x.session_id===sessionId);if(s)patchSession({starred:!s.starred})};$('archiveBtn').onclick=()=>patchSession({archived:true});$('menuBtn').onclick=()=> $('sidebar').classList.toggle('open');
$('input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('form').requestSubmit()}};
$('stop').onclick=async()=>{if(!sessionId)return;await api('/api/cancel',{method:'POST',body:JSON.stringify({session_id:sessionId})});$('statStatus').textContent='cancelled'};
$('form').onsubmit=async e=>{e.preventDefault();const text=$('input').value.trim();if(!text||running)return;$('input').value='';thinkEl=assistantEl=statusEl=null;message('user',text);liveStatus('正在连接模型');running=true;$('send').disabled=true;$('stop').hidden=false;$('statStatus').textContent='running';if(!sessionId)sessionId='ses_'+Math.random().toString(36).slice(2,10);seen=new Set();pollTimer=setInterval(poll,350);try{const endpoint=pending?'/api/resume':'/api/chat';const body=pending?{session_id:sessionId,answer:text}:{text,session_id:sessionId,user_id:userId,workspace_id:workspaceId};const d=await api(endpoint,{method:'POST',body:JSON.stringify(body)});await poll();pending=d.status==='pending';clearLiveStatus();if(d.final_text){if(assistantEl)assistantEl.textContent=d.final_text;else assistantEl=message('assistant',d.final_text)}else if(pending)eventRow('等待你的输入或审批');await loadSessions();setHeader();if(!sessions.find(s=>s.session_id===sessionId)?.title)refreshTitleSoon();await refreshStats()}catch(err){clearLiveStatus();eventRow('错误 · '+err.message,true);$('statStatus').textContent='failed'}finally{clearInterval(pollTimer);pollTimer=null;running=false;$('send').disabled=false;$('stop').hidden=true;$('input').focus()}};
(async()=>{try{await loadWorkspaces();await Promise.all([loadSessions(),loadSettings()]);resetStats()}catch(e){eventRow('初始化失败 · '+e.message,true)}})();
</script>
</body></html>
